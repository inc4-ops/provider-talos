apiVersion: machine.talos.m.inc4.net/v1alpha1
kind: ConfigurationApply
metadata:
  annotations:
    meta.upbound.io/example-id: machine/v1alpha1/configurationapply
  labels:
    testing.upbound.io/example-name: this
  name: this
  namespace: default
spec:
  forProvider:
    clientConfiguration: ${talos_machine_secrets.this.client_configuration}
    configPatches:
    - |-
      ${yamlencode({
            machine = {
              install = {
                disk  = "/dev/sdd"
                image = "ghcr.io/siderolabs/installer:v1.12.6"
              }
            }
          })}
    machineConfigurationInputSecretRef:
      key: attribute.this.machine_configuration
      name: example-
    node: 10.5.0.2
