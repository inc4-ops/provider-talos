apiVersion: cluster.talos.m.inc4.net/v1alpha1
kind: Kubeconfig
metadata:
  name: talos-e2e
  namespace: talos-e2e
spec:
  managementPolicies: [Observe, Create, Update]
  providerConfigRef: {kind: ProviderConfig, name: talos}
  writeConnectionSecretToRef:
    name: talos-e2e-kubeconfig   # keys: attribute.kubeconfig_raw, kubeconfig, host, attribute.kubernetes_client_configuration.client_key, attribute.client_configuration.*
  forProvider:
    node: ${NODE_IP}
    endpoint: ${NODE_IP}
    clientConfiguration:
      caCertificateSecretRef: {name: talos-e2e-talosconfig, key: ca_certificate}
      clientCertificateSecretRef: {name: talos-e2e-talosconfig, key: client_certificate}
      clientKeySecretRef: {name: talos-e2e-talosconfig, key: client_key}
